# For Piranha only. Piranha sets the level of the root logger to ALL, and replaces its first handler, which must exist.
# A level for each top-level package name takes precedence over that of the root logger, so that Piranha only logs
# INFO and above, as GlassFish and Quarkus do, instead of logging at each request.
handlers = java.util.logging.ConsoleHandler
.level = INFO

cloud.level = INFO
com.level = INFO
io.level = INFO
jakarta.level = INFO
java.level = INFO
javax.level = INFO
jdk.level = INFO
net.level = INFO
org.level = INFO
sun.level = INFO
